<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>StudyAI Tutor</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<div class="tutor-container">


    <div class="header">

        <a href="/" class="back">
            ← Kembali
        </a>

        <h1>
            🤖 StudyAI Tutor
        </h1>

        <p>
            Tanya materi perkuliahan
            kepada AI Tutor.
        </p>

    </div>



    <!-- =========================================
         TANYA AI
    ========================================== -->

    <div class="section">

        <h2>
            💬 Tanya AI
        </h2>


        <textarea
            id="question"
            placeholder="Contoh: Apa itu inheritance?"
        ></textarea>


        <button onclick="askAI()">
            Tanya AI
        </button>


        <div
            id="answer"
            class="result hidden"
        ></div>

    </div>



    <!-- =========================================
         JELASKAN MATERI
    ========================================== -->

    <div class="section">

        <h2>
            📚 Jelaskan Materi
        </h2>


        <textarea
            id="material"
            placeholder="Contoh: Jelaskan tentang array"
        ></textarea>


        <button onclick="explainMaterial()">
            Jelaskan Materi
        </button>


        <div
            id="explanation"
            class="result hidden"
        ></div>

    </div>



    <!-- =========================================
         QUIZ
    ========================================== -->

    <div class="section">

        <h2>
            📝 Latihan Quiz
        </h2>


        <label>
            Pilih kategori:
        </label>


        <select id="category">

            <option value="Semua">
                Semua Materi
            </option>

            <option value="Algoritma">
                Algoritma
            </option>

            <option value="Struktur Data">
                Struktur Data
            </option>

            <option value="Database">
                Database
            </option>

            <option value="OOP">
                OOP
            </option>

            <option value="Web">
                Web
            </option>

            <option value="Python">
                Python
            </option>

            <option value="AI">
                AI
            </option>

        </select>


        <br><br>


        <label>
            Jumlah soal:
        </label>


        <select id="jumlah">

            <option value="5">
                5 Soal
            </option>

            <option value="10">
                10 Soal
            </option>

        </select>


        <br><br>


        <button onclick="generateQuiz()">
            Mulai Quiz
        </button>


        <div
            id="quiz"
            class="quiz-container"
        ></div>


        <button
            id="submitQuiz"
            onclick="submitQuiz()"
            class="hidden"
        >
            Kumpulkan Jawaban
        </button>


        <div
            id="quizResult"
            class="result hidden"
        ></div>

    </div>


</div>


<script
    src="{{ url_for('static', filename='script.js') }}"
></script>


</body>

</html>
